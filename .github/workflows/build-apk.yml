name: Build & Package Android APK

'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        timeout-minutes: 10

      - name: Prepare signing (master must use Actions keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "SIGNING_MODE=debug" >> "$GITHUB_ENV"
            echo "SIGNING_STATUS=Debug 簽署 (僅供 PR/非 master 測試)" >> "$GITHUB_ENV"
            echo "MISSING_SECRETS=未使用 Release Secrets" >> "$GITHUB_ENV"
            exit 0
          fi

          missing=()
          [[ -z "$KEYSTORE_BASE64" ]] && missing+=(KEYSTORE_BASE64)
          [[ -z "$KEYSTORE_PASSWORD" ]] && missing+=(KEYSTORE_PASSWORD)
          [[ -z "$KEY_ALIAS" ]] && missing+=(KEY_ALIAS)
          [[ -z "$KEY_PASSWORD" ]] && missing+=(KEY_PASSWORD)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required signing secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          keystore="$RUNNER_TEMP/money-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          echo "KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo "SIGNING_MODE=fixed" >> "$GITHUB_ENV"
          echo "SIGNING_STATUS=GitHub Actions 固定 KeyStore Release 簽署" >> "$GITHUB_ENV"
          echo "MISSING_SECRETS=無" >> "$GITHUB_ENV"

      - name: Validate Release KeyStore
        if: env.SIGNING_MODE == 'fixed'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Release KeyStore is missing or empty."
            exit 1
          fi
          # Validate the expected alias and password before spending time building the APK.
          # Redirect certificate details so no signing material is written to the logs.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGNING_MODE" = "fixed" ]; then
            echo "Building Release APK with fixed KeyStore..."
            ./gradlew assembleRelease
            echo "TARGET_APK=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          else
            echo "Building Debug APK with default debug KeyStore..."
            ./gradlew assembleDebug
            echo "TARGET_APK=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          fi

      - name: Verify APK Signature & Extract Fingerprints with apksigner
        run: |
          set -euo pipefail
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p artifacts

          if [ -z "$TARGET_APK" ] || [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK file not found at '$TARGET_APK'."
            exit 1
          fi

          NAMED_APK="artifacts/app-${SHORT_SHA}.apk"
          cp "$TARGET_APK" "$NAMED_APK"

          # 1. 計算 APK 檔案校驗碼 (File SHA-256 Checksum)
          FILE_SHA256=$(sha256sum "$NAMED_APK" | awk '{print $1}')
          (cd artifacts && sha256sum "app-${SHORT_SHA}.apk" > "app-${SHORT_SHA}.apk.sha256")

          # 2. 使用 Android SDK apksigner 驗證並提取簽章憑證指紋
          APKSIGNER_BIN=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER_BIN" ]; then
            APKSIGNER_BIN="apksigner"
          fi

          echo "Using apksigner: $APKSIGNER_BIN"
          VERIFY_OUTPUT=$("$APKSIGNER_BIN" verify --verbose --print-certs "$NAMED_APK")

          CERT_SHA1=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-1 digest:" | head -n 1 | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr 'a-z' 'A-Z')
          CERT_SHA256=$(echo "$VERIFY_OUTPUT" | grep -i "certificate SHA-256 digest:" | head -n 1 | awk '{print $NF}' | sed 's/../&:/g;s/:$//' | tr 'a-z' 'A-Z')

          if [ -z "$CERT_SHA1" ] || [ -z "$CERT_SHA256" ]; then
            echo "Error: Failed to extract SHA-1 or SHA-256 signature fingerprint from APK."
            exit 1
          fi

          # 3. 驗證並提取 Package Name
          AAPT_BIN=$(find $ANDROID_SDK_ROOT/build-tools -name "aapt" | sort -V | tail -n 1)
          if [ -z "$AAPT_BIN" ]; then
            AAPT_BIN="aapt"
          fi
          APK_PACKAGE=$("$AAPT_BIN" dump badging "$NAMED_APK" 2>/dev/null | grep "^package:" | head -n 1 | sed -E "s/^package: name='([^']+)'.*/\1/")

          if [ -z "$APK_PACKAGE" ]; then
            echo "Error: Failed to extract package name from APK."
            exit 1
          fi

          if [ "$APK_PACKAGE" != "com.moneytracker.app" ]; then
            echo "Error: Package name mismatch! Expected 'com.moneytracker.app', got '$APK_PACKAGE'"
            exit 1
          fi

          # 4. 輸出 apk_signature_fingerprints.txt
          REPORT_FILE="artifacts/apk_signature_fingerprints.txt"
          cat << EOF > "$REPORT_FILE"
          ===================================================================
          MoneyTracker Android App - APK 簽章指紋報告 (Google Cloud OAuth 專用)
          ===================================================================

          [基本資訊]
          - APK 檔名: app-${SHORT_SHA}.apk
          - Commit SHA: ${{ github.sha }}
          - Application ID / Package: ${APK_PACKAGE}
          - 簽章模式狀態: ${SIGNING_STATUS}
          - Secrets 狀態: ${MISSING_SECRETS}

          [Google Cloud Console OAuth 2.0 Client 登記資訊]
          - Package Name: ${APK_PACKAGE}
          - SHA-1 簽章憑證指紋: ${CERT_SHA1}
          - SHA-256 簽章憑證指紋: ${CERT_SHA256}

          [APK 檔案校驗碼 (File Checksum)]
          - APK 檔案 SHA-256: ${FILE_SHA256}

          ⚠️ 聲明與說明:
          1. 請將上述「SHA-1 簽章憑證指紋」填入 Google Cloud Console > 憑證 > Android OAuth 用戶端 ID 的 SHA-1 欄位。
          2. 請勿將「APK 檔案 SHA-256 校驗碼」與「簽章憑證指紋」混淆。
             - SHA-1 / SHA-256 簽章指紋代表 App 的簽署金鑰身份。
             - APK 檔案 SHA-256 僅為檔案完整性校驗碼。
          EOF

          cat "$REPORT_FILE"

          # 5. 寫入 GitHub Actions Job Summary
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📱 MoneyTracker APK 建置與簽章指紋報告

          * **APK 檔名**: \`app-${SHORT_SHA}.apk\`
          * **Commit SHA**: \`${{ github.sha }}\`
          * **Package Name**: \`${APK_PACKAGE}\`
          * **簽章模式**: **${SIGNING_STATUS}**
          * **Secrets 狀態**: \`${MISSING_SECRETS}\`

          #### 🔑 Google Cloud Console OAuth 2.0 設定必填資訊：
          * **Package Name**:
            \`\`\`text
            ${APK_PACKAGE}
            \`\`\`
          * **SHA-1 簽章憑證指紋**:
            \`\`\`text
            ${CERT_SHA1}
            \`\`\`
          * **SHA-256 簽章憑證指紋**:
            \`\`\`text
            ${CERT_SHA256}
            \`\`\`

          #### 📄 APK 檔案校驗碼 (File Checksum)：
          * **APK File SHA-256**: \`${FILE_SHA256}\`
          EOF

      - name: Upload APK & Signature Fingerprint Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-apk-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 30

  publish:
    name: Publish signed latest Release
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: money-master-release
      cancel-in-progress: false

    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: app-apk-${{ github.sha }}
          path: release-assets

      - name: Publish latest and remove older Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A slow old run must never replace a newer commit's published APK.
          master_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq '.object.sha')"
          if [[ "$master_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping release: master is now $master_sha, this run built $GITHUB_SHA."
            exit 0
          fi

          shopt -s nullglob
          apks=(release-assets/*.apk)
          checksums=(release-assets/*.apk.sha256)
          reports=(release-assets/apk_signature_fingerprints.txt)
          if (( ${#apks[@]} != 1 || ${#checksums[@]} != 1 || ${#reports[@]} != 1 )); then
            echo "::error::Expected exactly one signed APK, checksum and signature report."
            exit 1
          fi
          (cd release-assets && sha256sum --check *.apk.sha256)

          tag="money-build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          title="MoneyTracker Build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA:0:7})"
          notes="Automatically built from master commit ${GITHUB_SHA}. Signed with the GitHub Actions release keystore. APK checksum and certificate fingerprints are attached."

          if gh release view "$tag" >/dev/null 2>&1; then
            # Make reruns idempotent.
            gh release upload "$tag" "${apks[@]}" "${checksums[@]}" "${reports[@]}" --clobber
            gh release edit "$tag" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" "${apks[@]}" "${checksums[@]}" "${reports[@]}" \
              --target "$GITHUB_SHA" --title "$title" --notes "$notes" --latest
          fi

          # Prune only after the new APK was successfully published.
          # Delete tags as well, so the repository retains only the newest Release tag.
          old_tags="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
            gh release delete "$old_tag" --yes --cleanup-tag
          done <<< "$old_tags"

          {
            echo "### Latest signed APK Release"
            echo "Published: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
            echo "Tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"
